[project]
name = "cashgraph"
version = "0.2.0"
description = "Cashtag attention topology: graph, piggyback radar, farm clusters, first-timer spikes."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "cashgraph"}]
dependencies = [
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
xapi = ["httpx>=0.27"]

[project.scripts]
cashgraph = "cashgraph.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
